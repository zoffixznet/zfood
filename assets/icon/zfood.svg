<?xml version="1.0" encoding="UTF-8"?>
<!-- ZFood app icon: a kitchen scale with a numeric readout, drawn in the
     nutrition-label palette. Geometry is deliberately simple (rects only)
     so any SVG rasterizer renders it identically. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- label tile: ink border around paper -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#141414"/>
  <rect x="22" y="22" width="468" height="468" rx="84" fill="#FAF9F6"/>

  <!-- weighing platform (the label's heavy top rule) -->
  <rect x="80" y="102" width="352" height="46" rx="14" fill="#141414"/>
  <!-- scale body -->
  <rect x="116" y="168" width="280" height="240" rx="40" fill="#141414"/>

  <!-- readout window -->
  <rect x="152" y="238" width="208" height="96" rx="16" fill="#FAF9F6"/>
  <!-- readout digits -->
  <rect x="180" y="258" width="30" height="56" rx="7" fill="#3E7B27"/>
  <rect x="241" y="258" width="30" height="56" rx="7" fill="#3E7B27"/>
  <rect x="302" y="258" width="30" height="56" rx="7" fill="#3E7B27"/>
</svg>
