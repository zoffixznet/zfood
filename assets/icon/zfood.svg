<?xml version="1.0" encoding="UTF-8"?>
<!-- ZFood app icon: a kitchen scale with a numeric readout, drawn in the
     app's porcelain-and-teal palette. Geometry is deliberately simple
     (rects only) so any SVG rasterizer renders it identically. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- porcelain tile with a hairline edge -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#E3E5E8"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="#F2F3F5"/>

  <!-- weighing platform -->
  <rect x="80" y="102" width="352" height="46" rx="14" fill="#1B1F24"/>
  <!-- scale body -->
  <rect x="116" y="168" width="280" height="240" rx="40" fill="#1B1F24"/>

  <!-- readout window -->
  <rect x="152" y="238" width="208" height="96" rx="16" fill="#F2F3F5"/>
  <!-- readout digits -->
  <rect x="180" y="258" width="30" height="56" rx="7" fill="#0E7568"/>
  <rect x="241" y="258" width="30" height="56" rx="7" fill="#0E7568"/>
  <rect x="302" y="258" width="30" height="56" rx="7" fill="#0E7568"/>
</svg>
